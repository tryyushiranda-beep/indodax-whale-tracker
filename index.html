<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indodax Pre-Pump Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 font-sans">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
    <div>
      <h1 class="text-xl font-bold text-green-400">⚡ Whale Radar</h1>
      <p class="text-xs text-gray-400">Detektor Akumulasi Bandar Indodax</p>
    </div>
    <span class="bg-green-900 text-green-300 text-xs px-2.5 py-1 rounded-full animate-pulse">● Live</span>
  </div>

  <!-- Container Sinyal -->
  <div id="signal-container" class="space-y-4">
    <div class="text-center text-gray-500 py-10">Menganalisis pasar Indodax...</div>
  </div>

  <script>
    async function loadSignals() {
      try {
        // Membaca file signals.json langsung dari GitHub Pages
        const response = await fetch('./signals.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error("File signals.json belum dibuat");
        
        const data = await response.json();
        const container = document.getElementById('signal-container');
        container.innerHTML = '';

        if (!data || data.length === 0) {
          container.innerHTML = `
            <div class="bg-gray-800 p-6 rounded-xl text-center text-gray-400">
              Belum ada sinyal akumulasi bandar yang memenuhi kriteria saat ini. Sistem otomatis terus memantau...
            </div>`;
          return;
        }

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-gray-800 border-l-4 border-green-500 p-4 rounded-xl shadow-lg space-y-2";
          
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="bg-green-500/20 text-green-400 font-bold px-2 py-0.5 rounded text-xs">🟢 SIAP BELI</span>
              <span class="text-xs text-gray-400">${item.timestamp}</span>
            </div>
            
            <div class="flex justify-between items-baseline pt-1">
              <h2 class="text-lg font-bold text-white">${item.coin}</h2>
              <span class="text-base font-semibold text-green-400">${item.price}</span>
            </div>

            <div class="flex justify-between text-xs text-gray-400 bg-gray-900/50 p-2 rounded">
              <span>Perubahan: <strong class="text-white">${item.change}</strong></span>
              <span>Volume IDR: <strong class="text-white">${item.volume}</strong></span>
            </div>

            <p class="text-xs text-gray-300 pt-1">${item.message}</p>

            <a href="https://indodax.com/market/${item.id}" target="_blank" 
               class="block text-center bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded-lg text-xs mt-2 transition">
               Buka Chart Indodax ↗
            </a>
          `;
          
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('signal-container').innerHTML = `
          <div class="bg-gray-800 p-6 rounded-xl text-center text-gray-400">
            Sedang menyiapkan pemindaian pertama... Silakan muat ulang halaman ini dalam 1-2 menit.
          </div>`;
      }
    }

    loadSignals();
    setInterval(loadSignals, 10000);
  </script>
</body>
</html>
