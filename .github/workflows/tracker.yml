name: Indodax Auto Tracker

on:
  schedule:
    - cron: '*/5 * * * *' # Jalan otomatis tiap 5 menit
  workflow_dispatch: # Boleh dijalankan manual

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios

      - name: Run Scanner
        run: node scanner.js

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add signals.json
          git commit -m "Auto-update signals.json" || exit 0
          git push
